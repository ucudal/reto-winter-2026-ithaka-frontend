name: ithaka-frontend

services:
  web:
    image: ithaka-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
