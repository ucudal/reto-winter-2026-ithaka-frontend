apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithaka-frontend
  namespace: ithaka-frontend
  labels:
    app: ithaka-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ithaka-frontend
  template:
    metadata:
      labels:
        app: ithaka-frontend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: frontend
          image: crretoxmas2024.azurecr.io/ithaka-frontend:test-5bf36ae
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ithaka-frontend-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "250Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
