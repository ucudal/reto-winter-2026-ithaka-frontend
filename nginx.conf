server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: las rutas desconocidas caen a index.html para que funcione el
    # ruteo del lado del cliente (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para los assets con hash de contenido que emite Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El shell HTML no se cachea, así los deploys nuevos se toman enseguida.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
